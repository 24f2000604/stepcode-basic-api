openapi: 3.0.3
info:
  title: Notes API
  version: 1.0.0
  description: Create, list, read, update and delete notes.
servers:
  - url: http://localhost:3000
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: The service is up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
  /notes:
    get:
      summary: List notes, newest first
      responses:
        "200":
          description: All notes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Note" }
    post:
      summary: Create a note
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NoteInput" }
      responses:
        "201":
          description: The note was created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Note" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /notes/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Get one note
      responses:
        "200":
          description: The note.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Note" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      summary: Update a note's title or body
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotePatch" }
      responses:
        "200":
          description: The updated note.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Note" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Delete a note
      responses:
        "204": { description: The note was deleted. }
        "404": { $ref: "#/components/responses/NotFound" }
components:
  schemas:
    Note:
      type: object
      required: [id, title, body, createdAt, updatedAt]
      properties:
        id: { type: string, example: "1" }
        title: { type: string, maxLength: 120 }
        body: { type: string, maxLength: 5000 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    NoteInput:
      type: object
      required: [title]
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        body: { type: string, maxLength: 5000, default: "" }
    NotePatch:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        body: { type: string, maxLength: 5000 }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: validation_failed }
            message: { type: string }
            details:
              type: array
              items:
                type: object
                properties:
                  field: { type: string }
                  message: { type: string }
  responses:
    BadRequest:
      description: The request body is invalid.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No note has that id.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
